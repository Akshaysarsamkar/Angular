<div class="expense-form-container">
    <h2>Add Expense</h2>

    <form #expenseForm="ngForm" (ngSubmit)="onSubmit(expenseForm)">

        <div class="form-control">
            <label>Amount</label>
            <input type="number" placeholder="Enter amount" name="amount" [(ngModel)]="amount" #amount="ngModel"
                required>
            <small *ngIf="amount.invalid && amount.touched" class="error-text">
                Please enter a valid amount
            </small>
        </div>

        <div class="form-control">
            <label>Category</label>
            <select name="category" [(ngModel)]="category" #category="ngModel" required>
                <option value="" disabled selected>Select category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
            <small *ngIf="category.invalid && category.touched">category is required</small>

        </div>

        <div class="form-control">
            <label>Note</label>
            <textarea placeholder="Add a note..." name="note" [(ngModel)]="note" maxlength="50"></textarea>
        </div>

        <button type="submit" class="btn-primary" [disabled]="expenseForm.invalid">Submit</button>
    </form>
</div>

<app-success-message *ngIf="showMessage" [message]="'Expense added successfully!'" [show]="showMessage"
    (close)="closePopup()"></app-success-message>
